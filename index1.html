<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Planner Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

<div class="logo">
<h1>Study Planner</h1>
<p>Your personal study dashboard</p>
</div>

<nav>

<a class="active" href="index.html">Dashboard</a>

<a href="mathematics.html">
📘 Mathematics
</a>

<a href="physics.html">
⚛ Physics
</a>

<a href="chemistry.html">
🧪 Chemistry
</a>

</nav>

<div class="header-buttons">

<button id="notificationButton">
🔔 Enable Notifications
</button>

<button id="themeButton">
🌙 Dark Mode
</button>

</div>

</header>

<main>

<section class="calendar-section">

<div class="calendar-header">

<div>

<h2>Calendar</h2>

<p>
Read-only monthly overview
</p>

</div>

<div>

<button id="todayButton">
Today
</button>

</div>

</div>

<div id="calendar"></div>

</section>

<aside>

<section class="card">

<h3>Today's Schedule</h3>

<div id="todaySchedule">

<p>No events today.</p>

</div>

</section>

<section class="card">

<h3>Upcoming</h3>

<div id="upcomingEvents">

</div>

</section>

<section class="card">

<h3>Study Statistics</h3>

<div class="stats">

<div class="stat">

<span>This Week</span>

<strong id="weekHours">
0 hrs
</strong>

</div>

<div class="stat">

<span>Study Streak</span>

<strong id="streak">
0 days
</strong>

</div>

<div class="stat">

<span>Next Class</span>

<strong id="nextClass">
—
</strong>

</div>

</div>

</section>

<section class="card">

<h3>Subject Breakdown</h3>

<div class="subjectProgress">

<div>

<label>📘 Mathematics</label>

<progress id="mathProgress" max="100" value="0"></progress>

</div>

<div>

<label>⚛ Physics</label>

<progress id="physicsProgress" max="100" value="0"></progress>

</div>

<div>

<label>🧪 Chemistry</label>

<progress id="chemistryProgress" max="100" value="0"></progress>

</div>

</div>

</section>

</aside>

</main>

<footer>

<p>

Study Planner Dashboard

</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>

<script src="js/storage.js"></script>

<script src="js/calendar.js"></script>

<script src="js/dashboard.js"></script>

<script src="js/notifications.js"></script>

<script src="js/app.js"></script>

</body>
</html>
