<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StuCal</title>
<meta name="description" content="A clean, editable calendar for planning study sessions, assignments, and exams.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">Study Log</span>
      <h1>Your study calendar</h1>
      <!-- NEW: Elegant, dynamic subtext label -->
      
    </div>
    <p id="welcomeSubtext" style="font-family: var(--font-body), sans-serif; font-size: 13px; color: #555555; margin: 4px 0 0 0; font-weight: 400;"></p>
    <!--<div class="streak">
       <h2 id="welcomeSubtext">...</h2>
    </div>-->
  </header>
  <div class="layout">
    <div class="calendar-wrap">
      <!-- 1. Changed ID to reflect a rolling day/date view badge rather than a fixed month tab -->
      <div class="month-tab" id="viewTab">3-Day View</div>
      <div class="calendar-card">
        <div class="calendar-head">
          <div class="month-nav">
            <!-- 2. Updated IDs and aria-labels for day navigation -->
            <button class="nav-btn" id="prevBtn" aria-label="Previous days">‹</button>
            <div class="month-label" id="dateRangeLabel">Loading days...</div>
            <button class="nav-btn" id="nextBtn" aria-label="Next days">›</button>
          </div>
          <div style="display:flex; gap:8px; align-items:center;">
            <button class="today-btn" id="todayBtn">Today</button>
            <button class="add-btn" id="addEventBtn">+ Add session</button>
          </div>
        </div>
        <!-- 3. Kept the grid container. We will inject exactly 3 day-columns into this element via JavaScript -->
        <div class="grid" id="grid" style="grid-template-columns: repeat(3, 1fr);"></div>
      </div>
    </div>

    <aside class="sidebar">
      <div class="panel">
        <h2>Next 5 items</h2>
        <div class="agenda-list" id="agendaList"></div>
      </div>

      <div class="panel">
        <h2>Show on calendar</h2>
        <div class="legend" id="legend"></div>
      </div>
    <!-- Restored Direct Sidebar Controls Block -->
<div class="field" style="display: flex; gap: 8px; margin-top: 15px; margin-bottom: 5px;">
  <button id="exportBtn" class="pill" style="justify-content: center; background: #E8EAEF !important; border-color: #C5C9D4 !important; width: 50%;">📥 Backup</button>
  <button id="importBtn" class="pill" style="justify-content: center; background: #E8EAEF !important; border-color: #C5C9D4 !important; width: 50%;">📤 Restore</button>
</div>

    <div class="panel">
        <button class="reset-btn" id="resetBtn">Reset to defaults</button>
        <p class="storage-note">
          Events you add here are saved in this browser only. To edit the
          starting set from the source code instead, open <code>js/events.js</code>.
        </p>
      </div>

<input type="file" id="hiddenFileInput" accept=".json" style="display: none;">

    </aside>
  </div>

  <p class="footer-note">Click any day to add an event · Click an event to edit or delete it</p>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">New event</h3>
    <form id="eventForm">
      <div class="field">
        <label for="titleInput">Title</label>
        <input type="text" id="titleInput" placeholder="e.g. Read ch. 5 — Thermodynamics" required maxlength="80">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="dateInput">Date</label>
          <input type="date" id="dateInput" required>
        </div>
        <div class="field">
          <label for="timeInput">Time (optional)</label>
          <input type="time" id="timeInput">
        </div>
      </div>
 <div class="field">
        <label for="recurrenceInput">Repeat</label>
        <select id="recurrenceInput">
          <option value="none">Does not repeat</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
        </select>
      </div>

  <div class="field">
        <label>Type (Select all that apply)</label>
        <div class="type-options">
          <!-- Hidden inputs paired with clickable labels acting as multi-select chips -->
          <label class="multi-chip-wrapper">
            <input type="checkbox" name="eventTags" value="study" style="display: none;">
            <span class="chip-label">Study</span>
          </label>
          <label class="multi-chip-wrapper">
            <input type="checkbox" name="eventTags" value="class" style="display: none;">
            <span class="chip-label">Class</span>
          </label>
          <label class="multi-chip-wrapper">
            <input type="checkbox" name="eventTags" value="mock" style="display: none;">
            <span class="chip-label">Mock</span>
          </label>
          <label class="multi-chip-wrapper">
            <input type="checkbox" name="eventTags" value="physics" style="display: none;">
            <span class="chip-label">Physics</span>
          </label>
          <label class="multi-chip-wrapper">
            <input type="checkbox" name="eventTags" value="chemistry" style="display: none;">
            <span class="chip-label">Chemistry</span>
          </label>
          <label class="multi-chip-wrapper">
            <input type="checkbox" name="eventTags" value="mathematics" style="display: none;">
            <span class="chip-label">Mathematics</span>
          </label>
          <label class="multi-chip-wrapper">
            <input type="checkbox" name="eventTags" value="general" style="display: none;">
            <span class="chip-label">General</span>
          </label>
        </div>
      </div>
            <!-- Place this inside the <form id="eventForm"> -->
      <div class="field" style="display:flex; align-items:center; gap:8px; margin-top:10px;">
        <input type="checkbox" id="importantInput" style="width:auto; margin:0;">
        <label for="importantInput" style="margin:0; text-transform:none; cursor:pointer;">
          ⭐ Mark as Important Event (Triggers Notification)
        </label>
      </div>



      <div class="field">
        <label for="notesInput">Notes (optional)</label>
        <textarea id="notesInput" placeholder="Anything worth remembering about this one"></textarea>
      </div>

      <div class="modal-actions">
        <div class="modal-actions-left">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-ghost" id="closeModalBtn">Cancel</button>
        </div>
        <button type="button" class="btn btn-danger" id="deleteBtn" style="display:none;">Delete</button>
      </div>
    </form>
  </div>
</div>

<script src="js/events.js"></script>
<script src="js/app.js"></script>
</body>
</html>

</body>
</html>
